# Nombre de la aplicación
spring.application.name=bancosol-app

# Conexión a la base de datos de Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/bancosol_db
spring.datasource.username=bancosol_user
spring.datasource.password=bancosol_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
# 'update' hace que Hibernate cree y actualice las tablas automáticamente según las clases Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Ejecutar siempre data.sql al arrancar
spring.sql.init.mode=always
# Asegura que data.sql se ejecute tras inicializar Hibernate (JPA)
spring.jpa.defer-datasource-initialization=true