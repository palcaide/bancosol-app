version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: bancosol-postgres
    restart: always
    environment:
      POSTGRES_DB: bancosol_db
      POSTGRES_USER: bancosol_user
      POSTGRES_PASSWORD: bancosol_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: